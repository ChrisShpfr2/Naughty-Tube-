name: Build Naughty Tube APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # lets a version tag attach the APK to a GitHub Release

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configure Android SDK licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ -d "$SDK_DIR" ]; then
            mkdir -p "$SDK_DIR/licenses"
            printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > "$SDK_DIR/licenses/android-sdk-license"
            printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n" > "$SDK_DIR/licenses/android-sdk-preview-license"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Signs releases with your own key when repository secrets exist; otherwise debug signing is used automatically.
      - name: Prepare release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.WISHY_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/wishy.jks"
            echo "WISHY_KEYSTORE=$RUNNER_TEMP/wishy.jks" >> "$GITHUB_ENV"
          fi

      - name: Build universal APK
        env:
          WISHY_KEYSTORE_PASSWORD: ${{ secrets.WISHY_KEYSTORE_PASSWORD }}
          WISHY_KEY_ALIAS: ${{ secrets.WISHY_KEY_ALIAS }}
          WISHY_KEY_PASSWORD: ${{ secrets.WISHY_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect APKs and Generate Checksums
        run: |
          mkdir -p dist
          find app/build/outputs/apk -type f -name "*.apk" -exec cp -f {} dist/ \; || true
          cd dist
          for f in *.apk; do
            [ -e "$f" ] && sha256sum "$f" > "$f.sha256"
          done
          ls -la

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NaughtyTube-apk
          path: dist/*
          if-no-files-found: error

      - name: Attach APK to GitHub Release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
